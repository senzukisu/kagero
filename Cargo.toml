[package]
name = "kagero"
version = "0.3.8"
edition = "2021"
rust-version = "1.85"
authors = ["Onibi Lab"]
description = "Kagero — an independent pixel-art editor by Onibi Lab"
license = "MIT"
readme = "README.md"
publish = false

[lib]
name = "kagero"
path = "src/lib.rs"

[[bin]]
name = "kagero"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
egui = "0.31.1"
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# Animated GIF encoding with per-frame delays, and palette reduction for >255 colors.
gif = "0.14"
color_quant = "1.1"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
rfd = "0.15.3"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
# Updater: HTTPS via the OS TLS stack (SChannel on Windows), version ordering,
# SHA-256 hashes and minisign (Ed25519) signature verification.
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }
semver = "1"
sha2 = "0.10"
minisign-verify = "0.3"
# Discord Rich Presence over the local desktop-client IPC pipe.
discord-rich-presence = "1"

[dev-dependencies]
# The font test reads Kagero Pixel with the same parser egui uses.
ab_glyph = "0.2"

[profile.dev.package."*"]
# Keep the canvas responsive in debug builds.
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
