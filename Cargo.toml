[package]
name = "kagero"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Onibi Lab"]
description = "Kagero — an independent pixel-art editor by Onibi Lab"
license = "MIT"
readme = "README.md"
publish = false

[lib]
name = "kagero"
path = "src/lib.rs"

[[bin]]
name = "kagero"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
egui = "0.31.1"
image = { version = "0.25.6", default-features = false, features = ["png"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15.3"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[profile.dev.package."*"]
# Keep the canvas responsive in debug builds.
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
