$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: Kagero
  structure:
    - type: section
      key: section-1
      title: Kagero
      path: kagero
      default: true
      children:
        - type: space
          key: space-kagero-docs
          title: Kagero Documentation
          path: docs
          default: true
          content:
            directory: ./docs
    - type: section
      key: section-2
      title: Changelog
      path: changelog
      children:
        - type: space
          key: space-1
          title: Changelog
          path: changelog
          default: true
          draft: true
          content:
            directory: ./changelog
